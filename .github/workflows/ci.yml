name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ListlyApp
    steps:
      - uses: actions/checkout@v4
      - name: Check app exists
        id: app-check
        run: |
          if [ -f "ListlyApp/package-lock.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ListlyApp/package-lock.json
      - name: Install dependencies
        if: steps.app-check.outputs.exists == 'true'
        run: npm ci
      - name: Run tests
        if: steps.app-check.outputs.exists == 'true'
        run: npm run test:all